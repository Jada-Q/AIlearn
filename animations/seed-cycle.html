  [56, [FRUIT.x * 0.6 + 0.2, FRUIT.y - 1.2, 10.4], add(FRUIT, [0, -1.6, 0])],
  [60.5, [0, 3.2, 13.2], [0, 3.0, 0]],
  [67.5, [1.4, 3.0, 12.4], [0, 3.0, 0]],
  [77, [-0.6, 3.1, 12.6], [0, 3.1, 0]],
  [84.3, add(FRUIT, [0.6, -0.3, 4.6]), add(FRUIT, [0, -0.1, 0])],
  [87, add(LAND, [SIDE * 1.2, 0.5, 4.6]), add(LAND, [0, 0.1, 0])],
  [92.5, add(SEED2, [SIDE * 0.9, 0.35, 3.8]), add(SEED2, [0, 0.15, 0])],
  [END, add(SEED2, [SIDE * 0.7, 0.25, 3.4]), add(SEED2, [0, 0.15, 0])],
];
const _cp = new V(), _ct = new V();
function cameraAt(t) {
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= t) i++;
  const [ta, pa, ga] = KEYS[i], [tb, pb, gb] = KEYS[i + 1];
  const k = sstep(ta, tb, t);
  _cp.set(lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k), lerp(pa[2], pb[2], k));
  _ct.set(lerp(ga[0], gb[0], k), lerp(ga[1], gb[1], k), lerp(ga[2], gb[2], k));
  if (!reduceMotion) {
    _cp.x += Math.sin(t * 0.13) * 0.25; _cp.y += Math.sin(t * 0.09 + 1) * 0.08;
    const shake = (1 - sstep(19.6, 20.9, t)) * (t > 19.6 ? 1 : 0) * 0.12;
    _cp.x += (Math.random() - .5) * shake; _cp.y += (Math.random() - .5) * shake;
  }
  camera.position.copy(_cp); camera.lookAt(_ct);
}

// ---------- 每帧更新 ----------
const _m = new THREE.Matrix4(), _s = new V(), _p = new V(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
const _qs = new THREE.Quaternion();

function updateBranches(list, M, S, thick, tonePlus, isTree, t) {
  for (let i = 0; i < list.length; i++) {
    const b = list[i];
    let g = clamp((S - b.s0) / b.len);
    if (isTree && !b.keep && b.depth >= 4) g *= 1 - sstep(b.witherT, b.witherT + 2.5, t);
    const r = b.r * thick;
    if (g <= 0.001) { M.mesh.setMatrixAt(i, ZERO); M.knots.setMatrixAt(i, ZERO); }
    else {
      M.mesh.setMatrixAt(i, _m.compose(b.p, b.q, _s.set(r, b.len * g, r)));
      M.knots.setMatrixAt(i, _m.compose(b.p, b.q, _s.set(r, r, r)));
    }
    const base = isTree ? (b.depth === 0 ? 0.02 : Math.min(0.3, 0.05 + b.depth * 0.04)) : 0.34;
    const tone = base + (isTree && b.depth >= 2 && !b.keep ? tonePlus : tonePlus * 0.4);
    M.tone.array[i] = tone; M.ktone.array[i] = tone;
  }
  M.mesh.instanceMatrix.needsUpdate = true; M.knots.instanceMatrix.needsUpdate = true;
  M.tone.needsUpdate = true; M.ktone.needsUpdate = true;
}

function fall(o, t, basePos, baseQ, size, mesh, i, attr, toneBase, fadeDur) {
  const dt = t - o.tDet;
  if (dt < o.T) {
    const sw = Math.sin(dt * o.fw + o.ph) * o.sway;
    _p.set(basePos.x + o.wind * dt + sw, basePos.y - o.v * dt, basePos.z + Math.cos(dt * o.fw * 0.7 + o.ph) * o.sway * 0.6);
    _q.copy(baseQ).multiply(_qs.setFromEuler(_e.set(o.spin.x * dt, o.spin.y * dt, o.spin.z * dt)));
    mesh.setMatrixAt(i, _m.compose(_p, _q, _s.setScalar(size)));
    attr.array[i] = toneBase;
  } else {
    _p.set(basePos.x + o.wind * o.T + Math.sin(o.T * o.fw + o.ph) * o.sway, o.gy, basePos.z + Math.cos(o.T * o.fw * 0.7 + o.ph) * o.sway * 0.6);
    mesh.setMatrixAt(i, _m.compose(_p, o.flat, _s.setScalar(size)));
    attr.array[i] = lerp(toneBase, 1, sstep(0, fadeDur, dt - o.T));
  }
}

function updateScene(t) {
  const S = treeP(t) * MAXS;
  const thick = lerp(0.22, 1, sstep(21, 46, t));
  const wither = 0.3 * sstep(70, 84, t);
  updateBranches(branches, TREE, S, thick, wither, true, t);
  updateBranches(roots, ROOT, rootP(t) * ROOTS_MAXS, lerp(0.35, 1, sstep(20, 46, t)), 0, false, t);

  // 叶
  const trunkTip = BASE.y + Math.min(S, branches[0].len);
  for (let i = 0; i < leaves.length; i++) {
    const L = leaves[i];
    if (L.coty !== undefined) {
      const k = sstep(22.8, 25.5, t) * (1 - sstep(31, 36, t));
      if (k < 0.01) { leafMesh.setMatrixAt(i, ZERO); continue; }
      leafMesh.setMatrixAt(i, _m.compose(_p.set(0, trunkTip - 0.02, 0.02), L.q, _s.setScalar(L.size * k)));
      leafA.array[i] = 0.12; continue;
    }
    const grow = sstep(0, 0.7, S - L.sAt) * sstep(L.tIn, L.tIn + 2.2, t);
    if (grow < 0.01) { leafMesh.setMatrixAt(i, ZERO); continue; }
    const tone = L.tone + (0.62 - L.tone) * sstep(69, L.tDet + 0.5, t);
    if (t < L.tDet) {
      const flutter = sstep(69, 72, t) * Math.sin(t * 7 + L.ph) * 0.15;
      _q.copy(L.q).multiply(_qs.setFromEuler(_e.set(flutter, 0, flutter * 0.6)));
      leafMesh.setMatrixAt(i, _m.compose(L.pos, _q, _s.setScalar(L.size * grow)));
      leafA.array[i] = tone;
    } else fall(L, t, L.pos, L.q, L.size, leafMesh, i, leafA, tone, 5);
  }
  leafMesh.instanceMatrix.needsUpdate = true; leafA.needsUpdate = true;

  // 花
  for (let i = 0; i < flowers.length; i++) {
    const F = flowers[i];
    const k = clamp((t - F.tB) / 1.1);
    const gone = sstep(F.tDet - 0.05, F.tDet + 0.15, t);
    const sc = k <= 0 ? 0 : F.size * easeOutBack(k) * (1 - gone);
    if (sc < 0.003) flowerMesh.setMatrixAt(i, ZERO);
    else flowerMesh.setMatrixAt(i, _m.compose(F.pos, F.q, _s.setScalar(sc)));
    flowerA.array[i] = sstep(0, 1, k);
  }
  flowerMesh.instanceMatrix.needsUpdate = true; flowerA.needsUpdate = true;
  for (let i = 0; i < petals.length; i++) {
    const P = petals[i];
    if (t < P.tDet) { petalMesh.setMatrixAt(i, ZERO); continue; }
    fall(P, t, P.pos, P.q, P.size, petalMesh, i, petalA, 0, 3);
  }
  petalMesh.instanceMatrix.needsUpdate = true; petalA.needsUpdate = true;

  // 果 / 种
  const os = orbState(t, orb.position);
  orb.visible = !!os[0];
  if (os[0]) orb.scale.set(os[1], os[2], os[3]);
  const hanging = t > 47 && t < 85.5;
  stem.visible = hanging;
  stem.scale.set(1, (fruitB.end.y - (FRUIT.y + FR * sstep(47, 55, t))) , 1);

  // 地面 / 土 / 山 / 雷 / 涟漪
  groundMat.uniforms.uDraw.value = sstep(1.2, 4.2, t);
  soilMat.uniforms.uSoil.value = sstep(6, 9.5, t);
  const mOp = sstep(31, 37, t) * (1 - 0.45 * sstep(80, 88, t));
  mountains.forEach(m => { m.uniforms.uOp.value = mOp; });
  const flash = (t > 19.55 && t < 19.9) || (t > 20.15 && t < 20.4);
  bolt.material.opacity = flash ? (0.75 + 0.25 * Math.sin(t * 90)) : 0;
  canvas.style.filter = !reduceMotion && ((t > 19.58 && t < 19.68) || (t > 20.18 && t < 20.24)) ? 'invert(1)' : '';
  pulse.position.copy(orb.position).add(_p.set(0, 0, 0.35));
  pulse.lookAt(camera.position);
  pulseMat.uniforms.uT.value = t;
  pulseMat.uniforms.uAmt.value = sstep(9.5, 11, t) * (1 - sstep(17, 19, t)) + sstep(91, 93, t) * (1 - sstep(99, 102, t));

  // 粒子
  let n = 0;
  for (const g of gather) {
    const k = (t - g.ts) / g.d;
    if (k <= 0 || k >= 1) { ptAlpha[n] = 0; ptSize[n] = 0; n++; continue; }
    const e = k * k * (3 - 2 * k);
    _p.copy(g.a).lerp(g.b, e); _p.y += Math.sin(e * Math.PI) * 1.2;
    ptPos.set([_p.x, _p.y, _p.z], n * 3);
    ptAlpha[n] = sstep(0, 0.15, k) * (1 - sstep(0.8, 1, k)) * 0.8; ptSize[n] = g.s * (1 - 0.6 * e); n++;
  }
  const nAmt = sstep(46, 48, t) * (1 - sstep(55, 57, t));
  for (const q of nourish) {
    const u = ((t - 46) * 0.11 + q.ph) % 1;
    if (nAmt <= 0 || t < 46) { ptAlpha[n] = 0; ptSize[n] = 0; n++; continue; }
    along(q.path, u, _p).add(q.j);
    ptPos.set([_p.x, _p.y, _p.z + 0.12], n * 3);
    ptAlpha[n] = nAmt * sstep(0, 0.08, u) * (1 - sstep(0.93, 1, u)) * 0.85; ptSize[n] = q.s; n++;
  }
  ptGeo.attributes.position.needsUpdate = true; ptGeo.attributes.aSize.needsUpdate = true; ptGeo.attributes.aAlpha.needsUpdate = true;

  cameraAt(t);
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const card = $('card'), hex = $('hex'), hexName = $('hexName'), sub = $('sub');
const hexLines = [...hex.children];
const bigLines = [...$('bigHex').children];
const timed = [...document.querySelectorAll('[data-in]')];
const chainSpans = [...$('chain').children];
let shown = -1;

function chapterIdx(t) { let i = 0; while (i < CH.length - 1 && t >= CH[i + 1].t0) i++; return i; }
function prevLines(i) { for (let j = i - 1; j >= 0; j--) if (CH[j].lines) return CH[j].lines; return CH[i].lines; }

function updateHUD(t) {
  const ci = chapterIdx(t), c = CH[ci];
  if (ci !== shown) {
    shown = ci;
    if (c.num) {
      $('cNum').textContent = c.num; $('cName').textContent = c.name; $('cSeason').textContent = c.season;
      $('cChar').textContent = c.ch; $('cQuote').textContent = '「' + c.quote + '」';
      hexName.textContent = c.name; sub.textContent = c.text;
    }
    document.querySelectorAll('.tick').forEach((el, k) => el.classList.toggle('on', +el.dataset.i <= ci));
  }
  const inC = c.num ? sstep(c.t0 + 0.2, c.t0 + 1.4, t) * (1 - sstep(c.t1 - 0.9, c.t1 - 0.1, t)) : 0;
  card.style.opacity = inC;
  sub.style.opacity = c.num ? sstep(c.t0 + 1.2, c.t0 + 2.4, t) * (1 - sstep(c.t1 - 1.1, c.t1 - 0.3, t)) : 0;
  const hexOp = sstep(6.2, 7.4, t) * (1 - sstep(94, 95, t));
  hex.style.opacity = hexOp; hexName.style.opacity = hexOp * inC;
  if (c.lines) {
    const from = prevLines(ci), k = sstep(c.t0, c.t0 + 1.6, t);
    hexLines.forEach((el, i) => el.style.setProperty('--g', (lerp(1 - from[i], 1 - c.lines[i], k) * 18).toFixed(2) + '%'));
  }

  // 终章
  const night = sstep(94.5, 97, t);
  $('night').style.opacity = night;
  document.body.classList.toggle('is-night', night > 0.5);
  for (const el of timed) {
    const a = +el.dataset.in, b = el.dataset.out ? +el.dataset.out : 1e9;
    const o = sstep(a, a + 1.2, t) * (1 - sstep(b - 0.8, b, t));
    el.style.opacity = o;
    el.style.visibility = o < 0.01 ? 'hidden' : 'visible';
  }
  // 剥 → 复：顶上那根阳爻出去，从底下回来
  const k1 = sstep(100.2, 101.8, t), k2 = sstep(101.4, 103, t), k3 = sstep(102.6, 104.4, t);
  const BO = [0, 0, 0, 0, 0, 1];
  bigLines.forEach((el, j) => {
    let slot, op = 1;
    if (j === 5) {
      if (t < 102.6) { slot = 5 + 1.4 * k1; op = 1 - k1; } else { slot = -1.4 + 1.4 * k3; op = k3; }
      el.style.setProperty('--c', '#efeee9');
    } else slot = j + k2;
    el.style.setProperty('--g', BO[j] ? '0%' : '18%');
    el.style.top = ((5 - slot) / 5 * 88) + '%';
    el.style.opacity = op;
  });
  const lit = t < 114.6 ? -1 : Math.floor((t - 114.6) / 0.55);
  chainSpans.forEach((s, i) => s.classList.toggle('on', i <= lit));

  $('fill').style.width = (t / END * 100) + '%';
  $('track').setAttribute('aria-valuenow', t.toFixed(0));
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  $('clock').textContent = fmt(t) + ' / ' + fmt(END);
}

// 时间轴刻度
const TICKS = [[1, '种'], [2, '真'], [3, '蓄'], [4, '养'], [5, '饰'], [6, '落'], [7, '复'], [8, '心']];
for (const [i, label] of TICKS) {
  const el = document.createElement('span'); el.className = 'tick'; el.textContent = label; el.dataset.i = i;
  el.style.left = (CH[i].t0 / END * 100) + '%'; $('track').appendChild(el);
}

// ---------- 播放控制 ----------
let t = 0, playing = true, last = performance.now();
const playBtn = $('play');
function setPlaying(p) { playing = p; playBtn.textContent = p ? '暂停' : '播放'; }
playBtn.onclick = () => { if (!playing && t >= END) t = 0; setPlaying(!playing); };
$('replay').onclick = () => { t = 0; setPlaying(true); };
const track = $('track');
function seekFrom(e) { const r = track.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * END; }
let dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); seekFrom(e); });
track.addEventListener('pointermove', e => { if (dragging) seekFrom(e); });
track.addEventListener('pointerup', () => { dragging = false; track.blur(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button')) return;
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight') t = Math.min(END, t + 5);
  if (e.key === 'ArrowLeft') t = Math.max(0, t - 5);
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const k = camera.aspect < 1.2 ? Math.min(2.0, 1.2 / camera.aspect) : 1;
  camera.fov = 2 * Math.atan(Math.tan(20 * Math.PI / 180) * k) * 180 / Math.PI;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !dragging) { t += dt; if (t >= END) { t = END; setPlaying(false); } }
  updateScene(t); updateHUD(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 供录制 / 调试：跳到指定秒并立即渲染一帧
window.seedCycle = {
  END,
  seek(x) { t = clamp(x, 0, END); setPlaying(false); updateScene(t); updateHUD(t); renderer.render(scene, camera); },
};
</script>
